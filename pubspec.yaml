name: moinsen_physics
description: Gravity Lab - A physics puzzle game where you manipulate gravity to solve challenges
repository: https://github.com/moinsen-dev/moinsen_physics
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.3.2'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.35.0
  flame_forge2d: ^0.19.2+3
  flutter_sound: ^9.30.0
  permission_handler: ^12.0.1
  vector_math: ^2.2.0
  flutter_riverpod: ^3.2.1
  intl: ^0.20.2
  logger: ^2.6.2

dev_dependencies:
  flutter_driver:
    sdk: flutter
  test: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/sounds/
    - assets/levels/
