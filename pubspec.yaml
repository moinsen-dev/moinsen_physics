name: moinsen_physics
description: Just a simple physics game
repository: https://github.com/moinsen-dev/moinsen_physics
version: 0.3.0

environment:
  sdk: 3.8.0
  flutter: 3.3.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flame: ^1.29.0
  flame_forge2d: ^0.19.0+2
  flutter_sound: ^9.28.0
  permission_handler: ^12.0.0+1
  vector_math: ^2.1.4
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  logger: ^2.5.0

dev_dependencies:
  flutter_driver:
    sdk: flutter
  test: any
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  golden_toolkit: ^0.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/sounds/
